name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-core:
    name: Windows / core tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile codex_session_cleaner.py test_cleaner.py
      - name: Test session discovery, filters, and sorting (no GUI)
        run: python -m unittest -v test_cleaner.CleanerTests

  linux-gui:
    name: Linux / GUI tests (virtual display)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
      - name: Run all synthetic regression tests
        run: xvfb-run -a /usr/bin/python3 -m unittest -v test_cleaner
